[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reaction-lens"
version = "0.1.0.dev0"
description = "Score a full reaction catalog from scientific text"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Imran Gadzhiev"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "safetensors>=0.5,<1"]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.34,<1"]
encoder = ["adapters==1.3.0", "transformers==4.57.6", "huggingface-hub>=0.34,<1"]
serve = ["fastapi>=0.142.2,<0.143", "uvicorn>=0.54,<0.55"]
dev = ["httpx>=0.28,<0.29", "build>=1.2,<2"]

[project.scripts]
reaction-lens = "reaction_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reaction_lens = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]
